<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>History</title>

    <link rel="stylesheet" href="style.css">
</head>

<body onload="initializeHistoryPage()">

<nav>

    <h2>SmartMed Cloud</h2>

    <div class="nav-links">

        <button class="theme-btn"
                onclick="toggleTheme()">
            🌙
        </button>

        <a href="dashboard.html">Dashboard</a>

        <button onclick="logoutUser()">
            Logout
        </button>

    </div>

</nav>

<div class="history-container">

    <div class="card history-card">

        <h1>Prediction History</h1>

        <table>

            <thead>

                <tr>

                    <th>Date</th>
                    <th>Symptoms</th>
                    <th>Prediction</th>
                    <th>Confidence</th>

                </tr>

            </thead>

            <tbody id="historyTable"></tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
